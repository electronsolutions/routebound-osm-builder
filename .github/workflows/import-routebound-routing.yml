name: Import Routebound OSM routing artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing routebound-osm-compact-rerun
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: routebound-osm-compact-rerun
          path: routing-artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Stream validated route profiles into Routebound
        env:
          PRODUCTION_URL: https://routebound.electronsolutions.us
          ROUTING_ARTIFACT_DIR: routing-artifact
          ROUTE_PROFILE_IMPORT_TOKEN: ${{ secrets.ROUTE_PROFILE_IMPORT_TOKEN }}
        run: node scripts/import-routebound-remote.mjs
